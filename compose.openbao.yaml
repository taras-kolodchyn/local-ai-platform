services:
  litellm:
    image: local-ai-platform/litellm-openbao:1.110.2-2.7.3
    build: ./integrations/openbao
    entrypoint: ["/usr/local/bin/bao"]
    command: ["agent", "-config=/opt/openbao/agent.hcl"]
    environment:
      # Clear the local fallback during Compose merge. Only the Agent sets the child's password.
      UI_PASSWORD: ""
      BAO_ADDR: ${OPENBAO_ADDR:?set OPENBAO_ADDR for the OpenBao UI password}
      BAO_CACERT: ${OPENBAO_CACERT:-}
    volumes:
      - type: bind
        source: ./.local/openbao/auth
        target: /run/openbao-auth
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run/openbao-ui:rw,noexec,nosuid,nodev,mode=0700,size=1m
    stop_grace_period: 45s
