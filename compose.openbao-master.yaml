services:
  litellm:
    command: ["agent", "-config=/opt/openbao/agent-master.hcl"]
    environment:
      LITELLM_MASTER_KEY: ""
      LITELLM_SALT_KEY: ""
      LITELLM_MASTER_KEY_SOURCE: openbao-local
    volumes:
      - type: bind
        source: ./.local/openbao-local/master-auth
        target: /run/openbao-auth
        read_only: true
        bind:
          create_host_path: false
