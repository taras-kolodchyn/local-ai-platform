name: Merge verified Moyai example documentation

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  merge:
    if: github.event.issue.pull_request && github.event.comment.user.id == 358212412 && startsWith(github.event.comment.body, 'MOYAI-VERIFIED ')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: moyai-docs-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the verdict, scope and CI before merging the reviewed commit
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GH_REPO"
          pr=$(jq -er '.issue.number' "$GITHUB_EVENT_PATH")
          head=$(jq -er '.comment.body | split("\n")[0] | sub("\r$"; "") | capture("^MOYAI-VERIFIED (?<sha>[0-9a-f]{40})$").sha' "$GITHUB_EVENT_PATH")
          actor=$(jq -er '.comment.user.id' "$GITHUB_EVENT_PATH")
          if ! jq -e '.comment.body | split("\n")[1:] | any(test("[^[:space:]]"))' "$GITHUB_EVENT_PATH" >/dev/null; then
            echo "Awaiting the verifier's supporting findings."
            exit 0
          fi
          details=$(gh api "$api/pulls/$pr")
          jq -e --arg repo "$GH_REPO" --arg sha "$head" --argjson actor "$actor" '
            (.state == "open" or (.merged and .merged_by.login == "github-actions[bot]")) and
            .draft == false and .user.id == $actor and
            .base.ref == "main" and .head.repo.full_name == $repo and .head.sha == $sha and
            .changed_files == 1 and .commits >= 1' <<<"$details" >/dev/null
          branch=$(jq -r .head.ref <<<"$details")
          [[ $branch =~ ^codex/moyai-issue-([1-9][0-9]*)$ ]] || exit 1
          issue=${BASH_REMATCH[1]}
          merged=$(jq -r .merged <<<"$details")
          gh api "$api/issues/$issue" | jq -e --arg owner "${GH_REPO%/*}" --argjson merged "$merged" '
            (.state == "open" or $merged) and (.pull_request == null) and .user.login == $owner and
            any(.labels[]; .name == "moyai:ready")' >/dev/null
          gh api "$api/pulls/$pr/files" | jq -e '
            length == 1 and .[0].status == "modified" and .[0].filename == "examples/rust-service/README.md"' >/dev/null
          if [[ $merged == false ]]; then
            # GraphQL variables are resolved by GitHub.
            # shellcheck disable=SC2016
            gh api graphql -f owner="${GH_REPO%/*}" -f repo="${GH_REPO#*/}" -F pr="$pr" -f query='
              query($owner:String!, $repo:String!, $pr:Int!) {
                repository(owner:$owner,name:$repo) { pullRequest(number:$pr) {
                  closingIssuesReferences(first:2) { totalCount nodes { number repository { nameWithOwner } } }
                } }
              }' | jq -e --arg repo "$GH_REPO" --argjson issue "$issue" '
                .data.repository.pullRequest.closingIssuesReferences |
                .totalCount == 1 and .nodes[0].number == $issue and .nodes[0].repository.nameWithOwner == $repo' >/dev/null
          fi
          green=false
          for ((attempt=0; attempt<45; attempt++)); do
            run=$(gh api --method GET "$api/actions/workflows/ci.yml/runs" -f event=pull_request -f head_sha="$head" -f branch="$branch" |
              jq -c --arg repo "$GH_REPO" --argjson pr "$pr" '.workflow_runs | map(select(.head_repository.full_name == $repo and any(.pull_requests[]?; .number == $pr))) | max_by(.id)')
            if [[ $(jq -r .status <<<"$run") == completed ]]; then
              [[ $(jq -r .conclusion <<<"$run") == success ]] || exit 1
              green=true
              break
            fi
            sleep 20
          done
          [[ $green == true ]] || exit 1
          latest=$(gh api --paginate --slurp "$api/issues/$pr/comments?per_page=100" | jq -r --argjson actor "$actor" --arg sha "$head" '
            add | map(select(.user.id == $actor) | (.body | split("\n")[0] | sub("\r$"; "")) | select(. == ("MOYAI-VERIFIED " + $sha) or . == ("MOYAI-CHANGES-REQUESTED " + $sha))) | last')
          [[ $latest == "MOYAI-VERIFIED $head" ]] || exit 1
          if [[ $merged == true ]]; then
            merge_sha=$(jq -er .merge_commit_sha <<<"$details")
          else
            result=$(gh api --method PUT "$api/pulls/$pr/merge" -f sha="$head" -f merge_method=squash)
            merge_sha=$(jq -er 'select(.merged == true) | .sha' <<<"$result")
          fi
          pr_ci=$(jq -r .html_url <<<"$run")
          pr_url="$GITHUB_SERVER_URL/$GH_REPO/pull/$pr"
          sha_url="$GITHUB_SERVER_URL/$GH_REPO/commit/$merge_sha"
          job_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"

          post_once() {
            local marker="<!-- moyai-progress:$issue:$1 -->"
            local message=$2
            local comments
            comments=$(gh api --paginate --slurp "$api/issues/$issue/comments?per_page=100") || return 1
            if ! jq -e --arg marker "$marker" 'add // [] | any(.user.login == "github-actions[bot]" and (.body | endswith($marker)))' <<<"$comments" >/dev/null; then
              gh api -X POST "$api/issues/$issue/comments" -f body="$(printf '%s\n\n%s' "$message" "$marker")" --silent
            fi
          }

          main_run() {
            gh api --method GET "$api/actions/workflows/ci.yml/runs" -f head_sha="$merge_sha" -f branch=main |
              jq -c '.workflow_runs | map(select(.event == "workflow_dispatch" or .event == "push")) | max_by(.id)'
          }

          ci_url=$job_url
          blocked() {
            trap - ERR
            post_once "blocked-$merge_sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              "**Post-merge CI needs attention.** [PR #$pr]($pr_url) merged into \`main\` at [${merge_sha:0:8}]($sha_url). CI has yet to confirm this commit. [CI run]($ci_url) · [Merge log]($job_url)."
            gh issue reopen "$issue" --repo "$GH_REPO"
            exit 1
          }
          trap blocked ERR
          post_once "merged-$merge_sha" \
            "**GitHub Actions merged [PR #$pr]($pr_url) into \`main\`** at [${merge_sha:0:8}]($sha_url). [PR CI passed]($pr_ci). CI on the merge commit is pending."
          run=$(main_run)
          min_attempt=1
          if [[ $run == null ]] || [[ $(jq -r '.status == "completed" and .conclusion != "success"' <<<"$run") == true ]]; then
            prior=$(jq -r '.id // 0' <<<"$run")
            if [[ $prior != 0 ]]; then
              min_attempt=$(jq -r '.run_attempt + 1' <<<"$run")
              gh run rerun "$prior" --repo "$GH_REPO"
            else
              gh workflow run ci.yml --repo "$GH_REPO" --ref main
            fi
          fi
          passed=false
          for ((attempt=0; attempt<45; attempt++)); do
            run=$(main_run)
            ci_url=$(jq -r --arg url "$job_url" '.html_url // $url' <<<"$run")
            if [[ $(jq -r .status <<<"$run") == completed && $(jq -r .run_attempt <<<"$run") -ge $min_attempt ]]; then
              [[ $(jq -r .conclusion <<<"$run") == success ]] || blocked
              passed=true
              break
            fi
            sleep 10
          done
          [[ $passed == true ]] || blocked
          trap - ERR
          post_once "done-$merge_sha" \
            "**Done.** [PR #$pr]($pr_url) passed [PR CI]($pr_ci). [CI on \`main\`]($ci_url) also passed for the merge commit [$merge_sha]($sha_url)."
          if [[ $(gh api "$api/issues/$issue" --jq .state) == open ]]; then
            gh issue close "$issue" --repo "$GH_REPO" --reason completed
          fi
