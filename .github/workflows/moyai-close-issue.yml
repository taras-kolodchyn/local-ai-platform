name: Close verified Moyai Rust issue

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions: {}

jobs:
  close:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.id == 358212412 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MERGED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Close the issue linked to the bot merge that passed main CI
        shell: bash
        run: |
          set -euo pipefail
          result=$(gh api graphql -f owner="${GH_REPO%/*}" -f name="${GH_REPO#*/}" -f oid="$MERGED_SHA" -f query='
            query($owner:String!,$name:String!,$oid:GitObjectID!) {
              repository(owner:$owner,name:$name) { object(oid:$oid) { ... on Commit {
                associatedPullRequests(first:100) { nodes {
                  merged mergeCommit { oid } author { login __typename } mergedBy { login __typename }
                  headRepository { nameWithOwner } baseRepository { nameWithOwner } headRefName baseRefName
                  closingIssuesReferences(first:2) { totalCount nodes { number state repository { nameWithOwner } } }
                } }
              } } }
            }')
          issue=$(jq -r --arg sha "$MERGED_SHA" --arg repo "$GH_REPO" '
            [.data.repository.object.associatedPullRequests.nodes[] |
              select(.merged and .mergeCommit.oid == $sha and .baseRefName == "main" and
                .baseRepository.nameWithOwner == $repo and .headRepository.nameWithOwner == $repo and
                .author.__typename == "Bot" and .mergedBy == .author and .author.login == "moyai-local-348144ed" and
                .closingIssuesReferences.totalCount == 1) |
              . as $pr | .closingIssuesReferences.nodes[] |
              select(.state == "OPEN" and .repository.nameWithOwner == $repo and
                $pr.headRefName == ("codex/app-5814110/issue-" + (.number|tostring))) | .number
            ] | if length == 1 then first else empty end' <<<"$result")
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --repo "$GH_REPO" --reason completed
          fi
