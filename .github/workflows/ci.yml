name: CI
run-name: ${{ github.event_name == 'pull_request' && format('CI PR {0} head {1} base {2}', github.event.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha) || format('CI on {0}', github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check host and container shell scripts
        run: bash scripts/lint.sh --shell-only
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: |
            retrieval/pyproject.toml
            mcp/offline/pyproject.toml
            execution/pyproject.toml
      - run: python -m venv .local/test-venv
      - run: .local/test-venv/bin/python -m pip install -e './retrieval[test]' -e './mcp/offline[test]' -e './execution'
      - run: .local/test-venv/bin/python -m pip check
      - run: .local/test-venv/bin/python -m pytest retrieval/tests
      - run: .local/test-venv/bin/python -m pytest mcp/offline/tests
      - name: Execution and PostgreSQL memory isolation tests
        run: .local/test-venv/bin/python -m pytest execution/tests -ra
      - run: .local/test-venv/bin/python -m unittest discover -s scripts/tests
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose -f compose.moyai.yaml config --quiet

  ubuntu-ports:
    name: Ubuntu published ports
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      listener:
        image: nginx:stable-alpine
        ports:
          - 127.0.0.1:3000:80
          - 127.0.0.1:4000:80
          - 127.0.0.1:8000:80
          - 127.0.0.1:8001:80
          - 127.0.0.1:9090:80
          - 127.0.0.1:12434:80
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify published listeners as the runner user
        run: |
          test "$(id -u)" -ne 0
          command -v lsof
          for port in 3000 4000 8000 8001 9090 12434; do
            curl --fail --silent --show-error --retry 5 --retry-connrefused \
              --output /dev/null "http://127.0.0.1:$port/"
          done
          bash scripts/host-ports.sh verify

  ubuntu-keys:
    name: Ubuntu service key permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Provision disposable keys using the startup scripts
        run: |
          test "$(id -u)" -ne 0
          make bootstrap
          # Supply the gateway response while exercising the real key writer.
          fixture_bin=$(mktemp -d)
          cat > "$fixture_bin/curl" <<'SH'
          #!/bin/sh
          printf '%s\n' '{"key":"sk-test-local"}'
          SH
          chmod +x "$fixture_bin/curl"
          PATH="$fixture_bin:$PATH" bash scripts/provision-client-key.sh
      - name: Build the shared retrieval and ingestion image
        run: docker compose build retrieval
      - name: Read mounted keys as each service user
        run: |
          status=0
          for service in retrieval ingestion; do
            keys=(/run/secrets/litellm_client_key)
            if [[ $service == retrieval ]]; then
              keys+=(/run/secrets/vector_backend_key)
            fi
            docker compose run --rm --no-deps --entrypoint sh "$service" -ec '
              test "$(id -u)" -ne 0
              failed=0
              for key do
                if ! test -s "$key" || ! head -c 1 "$key" > /dev/null; then
                  echo "$0 cannot read a nonempty $key" >&2
                  failed=1
                fi
              done
              exit "$failed"
            ' "$service" "${keys[@]}" || status=1
          done
          exit "$status"
