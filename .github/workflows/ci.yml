name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: |
            retrieval/pyproject.toml
            mcp/offline/pyproject.toml
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: python -m venv .local/test-venv
      - run: .local/test-venv/bin/python -m pip install -e './retrieval[test]' -e './mcp/offline[test]'
      - run: .local/test-venv/bin/python -m pip check
      - run: .local/test-venv/bin/python -m pytest retrieval/tests
      - run: .local/test-venv/bin/python -m pytest mcp/offline/tests
      - run: .local/test-venv/bin/python -m unittest discover -s scripts/tests
      - run: cargo test --locked --manifest-path examples/rust-service/Cargo.toml
      - run: bash -n scripts/*.sh
      - run: docker compose --env-file .env.example config --quiet
