name: CI
run-name: ${{ github.event_name == 'pull_request' && format('CI PR {0} head {1} base {2}', github.event.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha) || format('CI on {0}', github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify private checkout ownership with disposable Linux users
        run: sudo python3 -I integrations/moyai/tests/test_session_accounts.py
      - name: Check host and container shell scripts
        run: bash scripts/lint.sh --shell-only
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: |
            retrieval/pyproject.toml
            mcp/offline/pyproject.toml
            execution/pyproject.toml
      - run: python -m venv .local/test-venv
      - run: .local/test-venv/bin/python -m pip install -e './retrieval[test]' -e './mcp/offline[test]' -e './execution'
      - run: .local/test-venv/bin/python -m pip check
      - run: .local/test-venv/bin/python -m pytest retrieval/tests
      - run: .local/test-venv/bin/python -m pytest mcp/offline/tests
      - name: Execution and PostgreSQL memory isolation tests
        run: .local/test-venv/bin/python -m pytest execution/tests -ra
      - name: Install ripgrep for the smoke log scan tests
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - run: .local/test-venv/bin/python -m unittest discover -s scripts/tests
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose -f compose.moyai.yaml config --quiet
      - run: docker compose -f compose.moyai.yaml -f compose.moyai-github.yaml -f compose.moyai-volume-current.yaml config --quiet

  ubuntu-ports:
    name: Ubuntu published ports
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      listener:
        image: nginx:stable-alpine
        ports:
          - 127.0.0.1:3000:80
          - 127.0.0.1:4000:80
          - 127.0.0.1:8000:80
          - 127.0.0.1:8001:80
          - 127.0.0.1:9090:80
          - 127.0.0.1:12434:80
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify published listeners as the runner user
        run: |
          test "$(id -u)" -ne 0
          command -v lsof
          for port in 3000 4000 8000 8001 9090 12434; do
            curl --fail --silent --show-error --retry 5 --retry-connrefused \
              --output /dev/null "http://127.0.0.1:$port/"
          done
          bash scripts/host-ports.sh verify

      - name: Reject a specific non-loopback listener on port 8001
        run: |
          sudo unshare --net -- bash -ec '
            ip link set lo up
            ip address add 192.0.2.10/32 dev lo
            exec runuser -u "$1" -- python3 .github/ci/check-port-exposure.py
          ' verify "$(id -un)"

  ubuntu-keys:
    name: Ubuntu service key permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Provision disposable keys using the startup scripts
        run: |
          test "$(id -u)" -ne 0
          make bootstrap
          # Supply the gateway response while exercising the real key writer.
          fixture_bin=$(mktemp -d)
          cat > "$fixture_bin/curl" <<'SH'
          #!/bin/sh
          printf '%s\n' '{"key":"sk-test-local"}'
          SH
          chmod +x "$fixture_bin/curl"
          PATH="$fixture_bin:$PATH" bash scripts/provision-client-key.sh
      - name: Build the shared retrieval and ingestion image
        run: docker compose build retrieval
      - name: Read mounted keys as each service user
        run: |
          status=0
          for service in retrieval ingestion; do
            keys=(/run/secrets/litellm_client_key)
            if [[ $service == retrieval ]]; then
              keys+=(/run/secrets/vector_backend_key)
            fi
            docker compose run --rm --no-deps --entrypoint sh "$service" -ec '
              test "$(id -u)" -ne 0
              failed=0
              for key do
                if ! test -s "$key" || ! head -c 1 "$key" > /dev/null; then
                  echo "$0 cannot read a nonempty $key" >&2
                  failed=1
                fi
              done
              exit "$failed"
            ' "$service" "${keys[@]}" || status=1
          done
          exit "$status"

      - name: Authenticate to the running repository context service
        run: |
          python3 .github/ci/provision-context.py
          compose=(docker compose -f compose.moyai.yaml)
          "${compose[@]}" up -d --no-deps --wait --wait-timeout 90 repository-context
          "${compose[@]}" exec -T repository-context python -c '
          import os
          import sys
          import httpx

          assert os.getuid() != 0, "Expected the unprivileged service user"
          token = sys.stdin.read().strip()
          payload = {"jsonrpc": "2.0", "id": 1, "method": "tools/list", "params": {}}
          headers = {"Accept": "application/json, text/event-stream"}
          with httpx.Client(base_url="http://127.0.0.1:8000", trust_env=False) as client:
              denied = client.post("/mcp/", headers=headers, json=payload)
              assert denied.status_code == 401, denied.status_code
              headers["Authorization"] = "Bearer " + token
              response = client.post("/mcp/", headers=headers, json=payload)
              response.raise_for_status()
              tools = response.json()["result"]["tools"]
              assert any(tool["name"] == "search_repository" for tool in tools)
          with open("/run/secrets/context_gateway_key", "rb") as key:
              assert key.read(1), "Gateway key is empty"
          ' < .local/moyai/context-token
