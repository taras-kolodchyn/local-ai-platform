name: Задача для Moyai
description: Зміна документації прикладу Rust із перевіркою через PR та CI
labels: ["moyai:ready"]
body:
  - type: markdown
    attributes:
      value: "Під час пілота Developer бере в роботу задачі від власника репозиторію для `examples/rust-service/README.md`. Перебіг роботи та посилання на PR з’являться в цьому issue."
  - type: textarea
    id: change
    attributes:
      label: Що потрібно змінити і навіщо
      placeholder: Укажіть розділ README, потрібну зміну та кому вона допоможе.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерії приймання
      placeholder: Опишіть конкретний результат, який Verifier зможе перевірити в diff.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Як перевірити
      placeholder: Укажіть відповідний тест, команду або файл із прикладом.
    validations:
      required: true
