name: local-ai-platform

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *service-defaults
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: local_ai
      POSTGRES_USER: localai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make bootstrap}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_destination=jsonlog
      - -c
      - log_directory=/var/log/local-ai
      - -c
      - log_filename=postgres.log
      - -c
      - log_rotation_age=0
      - -c
      - log_truncate_on_rotation=off
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./.local/logs:/var/log/local-ai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localai -d local_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 2G

  mcp-provisioner:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: local_ai
      PGUSER: localai
      PGPASSWORD: ${POSTGRES_PASSWORD:?run make bootstrap}
      MCP_POSTGRES_PASSWORD: ${MCP_POSTGRES_PASSWORD:?run make bootstrap}
    entrypoint: ["/bin/bash", "/provision/provision-mcp-role.sh"]
    volumes:
      - ./postgres/provision-mcp-role.sh:/provision/provision-mcp-role.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    security_opt:
      - no-new-privileges:true

  redis:
    <<: *service-defaults
    image: redis:8.10.3-alpine
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --save 60 1000 --requirepass "$$REDIS_PASSWORD" --logfile /var/log/local-ai/redis.log
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run make bootstrap}
    volumes:
      - redis_data:/data
      - ./.local/logs:/var/log/local-ai
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - gateway
    deploy:
      resources:
        limits:
          memory: 512M

  headroom:
    <<: *service-defaults
    image: ghcr.io/headroomlabs-ai/headroom:0.44.0@sha256:10ef5f71c4cae3a02ca28107dfcf379aa73314ff26544c1f9988140e71f732f4
    environment:
      HEADROOM_HOST: 0.0.0.0
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
      # This deployment only serves /v1/compress. No inference provider is configured.
      HEADROOM_SKIP_UPSTREAM_CHECK: "1"
      HEADROOM_PROXY_TOKEN: ${HEADROOM_PROXY_TOKEN:?run make bootstrap}
      HEADROOM_DISABLE_KOMPRESS: "1"
      HF_HUB_OFFLINE: "1"
      HEADROOM_TELEMETRY: "off"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    tmpfs:
      - /root/.headroom:mode=0700
    networks:
      - compression

  reranker:
    <<: *service-defaults
    image: ghcr.io/headroomlabs-ai/headroom:0.44.0@sha256:10ef5f71c4cae3a02ca28107dfcf379aa73314ff26544c1f9988140e71f732f4
    entrypoint: [python, -m, uvicorn, server:app, --app-dir, /srv, --host, 0.0.0.0, --port, "8080", --no-access-log]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    environment:
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - ./integrations/reranker/server.py:/srv/server.py:ro
      - ./.local/models/reranker/df500e56a59fc34f37322735a40eff666200312e:/model:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [ranking]
    deploy:
      resources:
        limits: {memory: 512M, cpus: '2'}

  litellm:
    <<: *service-defaults
    image: ghcr.io/berriai/litellm:v1.110.2@sha256:ef798594ca3db8d81bad2e1439f536f49b71fe095ee9f20416f5e149b4e22035
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - litellm --config /etc/local-ai/litellm/config.yaml --port 4000 --num_workers 1 2>&1 | tee -a /var/log/local-ai/litellm.log
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-${OPENBAO_COMPOSE_PLACEHOLDER:?run make bootstrap}}
      HEADROOM_API_KEY: ${HEADROOM_PROXY_TOKEN:?run make bootstrap}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-${LITELLM_MASTER_KEY}}
      DATABASE_URL: postgresql://localai:${POSTGRES_PASSWORD}@postgres:5432/litellm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY}
      QWEN_MODEL: ${QWEN_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LITELLM_CACHE_TTL: ${LITELLM_CACHE_TTL}
      LITELLM_CACHE_NAMESPACE: ${LITELLM_CACHE_NAMESPACE}
      STORE_MODEL_IN_DB: "True"
      LITELLM_TURN_OFF_MESSAGE_LOGGING: ${LITELLM_TURN_OFF_MESSAGE_LOGGING:-true}
    volumes:
      # The renderer replaces config.yaml atomically. Mount its directory so UI reads see the current file.
      - ./.local/litellm:/etc/local-ai/litellm:ro
      - ./.local/logs:/var/log/local-ai
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      reranker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - gateway
      - data
      - observability
      - compression
      - ranking
    deploy:
      resources:
        limits:
          memory: 2G

  retrieval:
    <<: *service-defaults
    build:
      context: ./retrieval
      dockerfile: Dockerfile
    image: local-ai-platform/retrieval:0.1.0
    env_file:
      - path: ./.local/model-runtime.env
        required: false
    environment: &retrieval-env
      DATABASE_URL: postgresql://localai:${POSTGRES_PASSWORD}@postgres:5432/local_ai
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY_FILE: /run/secrets/litellm_client_key
      EMBEDDING_MODEL_ALIAS: local-embeddings
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      RETRIEVAL_DEFAULT_LIMIT: ${RETRIEVAL_DEFAULT_LIMIT}
      RETRIEVAL_MAX_LIMIT: ${RETRIEVAL_MAX_LIMIT}
      RETRIEVAL_MAX_CONTEXT_CHARS: ${RETRIEVAL_MAX_CONTEXT_CHARS}
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_LOG_FILE: /var/log/local-ai/retrieval.log
    volumes:
      - ./.local/logs:/var/log/local-ai
    secrets:
      - litellm_client_key
      - vector_backend_key
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - data
      - gateway
      - observability
    deploy:
      resources:
        limits:
          memory: 1G

  mcp-tools:
    <<: *service-defaults
    build:
      context: ./mcp/offline
      dockerfile: Dockerfile
    image: local-ai-platform/offline-mcp:0.1.0
    environment:
      MCP_ROOT: /workspace
      DATABASE_URL: postgresql://mcp_reader:${MCP_POSTGRES_PASSWORD}@postgres:5432/local_ai
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_LOG_FILE: /var/log/local-ai/mcp-tools.log
    volumes:
      - ${MCP_REPO_PATH:-.}:/workspace:ro
      - ./.local/logs:/var/log/local-ai
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      mcp-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - data
      - observability
      - mcp-host
    deploy:
      resources:
        limits:
          memory: 512M

  github-mcp:
    <<: *service-defaults
    image: ghcr.io/github/github-mcp-server:v1.14.0
    profiles: ["connected"]
    command: ["http"]
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "/server/github-mcp-server", "--version"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - gateway
    deploy:
      resources:
        limits:
          memory: 256M

  ingestion:
    image: local-ai-platform/retrieval:0.1.0
    env_file:
      - path: ./.local/model-runtime.env
        required: false
    profiles: ["tools"]
    environment:
      <<: *retrieval-env
      INDEX_ROOT: /workspace
      SERVICE_LOG_FILE: /var/log/local-ai/ingestion.log
    volumes:
      - ${INDEX_REPO_PATH:-.}:/workspace:ro
      - ./.local/logs:/var/log/local-ai
    secrets:
      - litellm_client_key
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    networks:
      - data
      - gateway
    security_opt:
      - no-new-privileges:true

  postgres-exporter:
    <<: *service-defaults
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://localai:${POSTGRES_PASSWORD}@postgres:5432/local_ai?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - observability

  redis-exporter:
    <<: *service-defaults
    image: oliver006/redis_exporter:v1.97.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gateway
      - observability

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - prometheus_bearer
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      litellm:
        condition: service_healthy
      retrieval:
        condition: service_healthy
      mcp-tools:
        condition: service_healthy
    networks:
      - observability
      - observability-host

  loki:
    <<: *service-defaults
    image: grafana/loki:3.7.10
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-verify-config", "-config.file=/etc/loki/config.yaml"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - observability

  alloy:
    <<: *service-defaults
    image: grafana/alloy:v1.22.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./.local/logs:/var/log/local-ai:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - observability

  grafana:
    <<: *service-defaults
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make bootstrap}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - observability
      - observability-host

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  ranking:
    internal: true
  compression:
    internal: true
  gateway:
  mcp-host:
  observability-host:
  data:
    internal: true
  observability:
    internal: true

secrets:
  litellm_client_key:
    file: ./.local/litellm-api-key
  prometheus_bearer:
    file: ./.local/litellm-master-key
  vector_backend_key:
    file: ./.local/vector-backend-key
